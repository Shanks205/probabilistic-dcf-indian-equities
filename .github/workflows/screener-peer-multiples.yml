name: Screener Peer Multiples

on:
  workflow_dispatch:
  push:
    paths:
      - "data/peer_sources/screener_peer_universe.csv"
      - "scripts/fetch_screener_peer_multiples.py"
      - "requirements.txt"
      - ".github/workflows/screener-peer-multiples.yml"

jobs:
  fetch-peer-multiples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Screener peer multiples
        run: |
          python scripts/fetch_screener_peer_multiples.py

      - name: Show fetch status
        run: |
          cat outputs/peer_tables/peer_multiple_screener_fetch_status.md || true

      - name: Upload peer multiple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screener-peer-multiple-outputs
          path: |
            outputs/peer_tables/peer_multiple_refresh_screener_filled.csv
            outputs/peer_tables/peer_multiple_screener_fetch_status.md
          if-no-files-found: warn
